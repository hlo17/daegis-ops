global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs: [{ targets: ['prometheus:9090'] }]

  # node-exporter を監視したい場合（いなければ削ってOK）
  - job_name: 'node'
    static_configs:
      - targets: ['192.168.0.183:9100']
