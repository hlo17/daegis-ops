route:
  receiver: slack-notify

receivers:
  - name: slack-notify
    slack_configs:
      - api_url: '  # ← 実際のWebhookに置換
        channel: '#daegis-alerts'
        title: '[Daegis] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
