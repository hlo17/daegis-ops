services:
  halu-relay:
    image: halu-halu
    container_name: halu-relay
    command: ["python","-m","halu_relay"]
    restart: unless-stopped
    env_file: [.env.halu]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport os,socket; s=socket.socket(); s.settimeout(2); s.connect((os.getenv('MQTT_HOST','127.0.0.1'), int(os.getenv('MQTT_PORT','1883')))); s.close(); print('ok')\nPY"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
